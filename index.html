  <script>
    // A aplicação original tenta guardar automaticamente em pagehide/beforeunload.
    // Em modo público isso poderia repor o estado antigo durante um reload de
    // sincronização e provocar um ciclo de "piscar". Os visitantes não editam,
    // por isso estes handlers ficam bloqueados apenas nesse modo.
    (function () {
      // A proteção também é feita no armazenamento: a aplicação original
      // guarda em pagehide/beforeunload e podia substituir o estado remoto.
      // O marcador é criado pelo sincronizador apenas durante esse reload.
      try {
        var storageSetItem = Storage.prototype.setItem;
        var storageRemoveItem = Storage.prototype.removeItem;
        sessionStorage.removeItem("smash_cloud_last_applied");
        function suppressRemoteReloadSave(storage) {
          return storage === localStorage && sessionStorage.getItem("smash_cloud_last_applied");
        }
        Storage.prototype.setItem = function (key, value) {
          if (suppressRemoteReloadSave(this)) return;
          return storageSetItem.apply(this, arguments);
        };
        Storage.prototype.removeItem = function (key) {
          if (suppressRemoteReloadSave(this)) return;
          return storageRemoveItem.apply(this, arguments);
        };
      } catch (_) {}

      function blockPublicUnloadSave(event) {
        if (document.body && document.body.classList.contains("smash-public-mode")) {
          event.stopImmediatePropagation();
        }
      }
      window.addEventListener("pagehide", blockPublicUnloadSave, true);
      window.addEventListener("beforeunload", blockPublicUnloadSave, true);
    })();

      '<div id="smash-admin-modal" role="dialog" aria-modal="true" aria-labelledby="smash-admin-dialog-title" aria-hidden="true" hidden>' +
        '<form id="smash-admin-form" class="smash-admin-dialog">' +
          '<h2 id="smash-admin-dialog-title">🔐 Desbloquear edição</h2>' +
          '<p>Introduza o PIN partilhado para editar resultados, jogadores e fotografias.</p>' +
          '<label class="smash-admin-field">PIN de edição' +
            '<input id="smash-admin-pin" class="smash-admin-input" name="admin-pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" required>' +
          '</label>' +
          '<div id="smash-admin-error" role="alert"></div>' +
          '<div class="smash-admin-dialog-actions">' +
            '<button id="smash-admin-cancel" class="smash-admin-button secondary" type="button">Cancelar</button>' +
            '<button id="smash-admin-submit" class="smash-admin-button" type="submit">Entrar</button>' +
          '</div>' +
        '</form>' +
      '</div>';

    document.body.insertBefore(ui, document.body.firstChild);
    document.getElementById("smash-admin-toggle").addEventListener("click", function () {
      if (isAdmin) lock();
      else openLogin();
    });
    document.getElementById("smash-admin-cancel").addEventListener("click", closeLogin);
    document.getElementById("smash-admin-form").addEventListener("submit", function (event) {
      event.preventDefault();
      unlock();
    });
    document.getElementById("smash-admin-modal").addEventListener("click", function (event) {
      if (event.target === event.currentTarget) closeLogin();
    });
  }

  function blockPublicMutation(event) {
    if (isAdmin || !isMutationControl(event.target)) return;
    event.preventDefault();
    event.stopImmediatePropagation();
  }

  async function init() {
    buildAdminUi();
    document.body.classList.add("smash-public-mode");
    tagAdminControls(document);

    ["click", "change", "input", "beforeinput", "submit", "drop"].forEach(function (eventName) {
      document.addEventListener(eventName, blockPublicMutation, true);
    });
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") closeLogin();
    });

    observer = new MutationObserver(function (mutations) {
      mutations.forEach(function (mutation) {
        mutation.addedNodes.forEach(function (node) {
          if (node.nodeType === 1 && !node.closest("#smash-admin-ui")) tagAdminControls(node);
        });
      });
    });
    observer.observe(document.getElementById("root") || document.body, { childList: true, subtree: true });

    var restored = await restoreSession();
    setMode(restored);
    await pullRemoteState();
    pollTimer = window.setInterval(pullRemoteState, 4000);
    window.addEventListener("focus", pullRemoteState);
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible") pullRemoteState();
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init, { once: true });
  else init();
})();
</script>
</body>
</html>
